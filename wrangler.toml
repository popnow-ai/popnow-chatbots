name = "popnow-chatbots"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [{ pattern = "bots.popnow.ai", custom_domain = true }]

[vars]
PUBLIC_URL = "https://bots.popnow.ai"
POPNOW_MCP_URL = "https://api.popnow.ai/mcp"
# Public ids, not secrets. Fill in after creating the apps.
DISCORD_APPLICATION_ID = "REPLACE_WITH_DISCORD_APPLICATION_ID"
SLACK_CLIENT_ID = "REPLACE_WITH_SLACK_CLIENT_ID"

# Secrets (wrangler secret put …): TOKEN_KEY, DISCORD_PUBLIC_KEY, DISCORD_BOT_TOKEN,
# SLACK_SIGNING_SECRET, SLACK_CLIENT_SECRET, and optionally SLACK_BOT_TOKEN. See README.

[[kv_namespaces]]
binding = "DATA"
# Create with `npx wrangler kv namespace create DATA` and paste the id here before deploying.
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[durable_objects.bindings]]
name = "JOBS"
class_name = "PopNowJob"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PopNowJob"]

[observability]
enabled = true
